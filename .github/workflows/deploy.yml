# 앱 자동 배포 — main 브랜치에 앱·API·DB 스키마가 바뀌어 올라오면 Cloudflare에 배포한다.
# 필요한 저장소 Secrets: CLOUDFLARE_API_TOKEN (Pages·D1 편집 권한), CLOUDFLARE_ACCOUNT_ID
# 있으면 함께 동기화: ANTHROPIC_API_KEY (앱의 홈페이지 즉시 검색용)
name: deploy

on:
  push:
    branches: [main]
    paths: ["app/**", "functions/**", "cf/**", "wrangler.toml", "package.json", ".github/workflows/deploy.yml"]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      P: golf-yardage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci || npm i

      - name: D1 id 연결
        run: |
          ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s).find(d=>d.name===process.env.P);console.log(x?x.uuid:"")})')
          [ -n "$ID" ] || { echo "D1 데이터베이스 $P 를 찾지 못함"; exit 1; }
          sed -i "s/database_id = \".*\"/database_id = \"$ID\"/" wrangler.toml
          echo "D1: $ID"

      - name: DB 스키마·업그레이드
        run: |
          npx wrangler d1 execute $P --remote --file=cf/schema.sql
          for f in cf/migrate_*.sql; do
            grep -E '^(ALTER|CREATE)' "$f" | while read -r s; do
              npx wrangler d1 execute $P --remote --command "$s" >/dev/null 2>&1 && echo "적용: $s" || echo "이미 적용됨: ${s:0:60}"
            done
          done

      - name: 비밀값 동기화
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            printf "%s" "$ANTHROPIC_API_KEY" | npx wrangler pages secret put ANTHROPIC_API_KEY --project-name $P >/dev/null && echo "ANTHROPIC_API_KEY 동기화"
          fi

      - name: 배포
        run: npx wrangler pages deploy app --project-name $P --branch main --commit-dirty=true --commit-message "${GITHUB_SHA::7}"
