# 관리 작업 — 서버의 구장 데이터를 손보는 일회성 작업 (예: 티 이름 바꾸기)
# 실행: Actions → admin → Run workflow, 또는 gh api 로 workflow_dispatch
name: admin

on:
  workflow_dispatch:
    inputs:
      task:   { description: "작업 (retee | dump | fix | upload)", required: true, default: "retee" }
      course_id: { description: "구장 id (dump는 이름 일부도 가능)", required: true }
      arg1: { description: "retee: 예) 5=RED,GREEN,WHITE1,WHITE2,BLUE  또는  BLUE,WHITE,RED", required: false, default: "" }
      arg2: { description: "예: 4=RED,GREEN,WHITE,BLUE (선택)", required: false, default: "" }

permissions:
  contents: write

jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: ${{ secrets.APP_URL }}
      WORKER_KEY: ${{ secrets.WORKER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - name: 티 이름 바꾸기
        if: github.event.inputs.task == 'retee'
        working-directory: crawler
        env:
          CID: ${{ github.event.inputs.course_id }}
          A1: ${{ github.event.inputs.arg1 }}
          A2: ${{ github.event.inputs.arg2 }}
        run: |
          if [ -n "$A2" ]; then python retee.py "$CID" "$A1" "$A2"; else python retee.py "$CID" "$A1"; fi

      - name: 검수값 반영 (crawler/fixes/<id>.json)
        if: github.event.inputs.task == 'fix'
        working-directory: crawler
        env:
          CID: ${{ github.event.inputs.course_id }}
        run: python apply_fix.py "$CID"

      - name: 저장소의 구장 데이터 올리기 (courses/<id>.json)
        if: github.event.inputs.task == 'upload'
        working-directory: crawler
        env:
          CID: ${{ github.event.inputs.course_id }}
        run: pip install -q -r requirements.txt && python worker.py --upload "$CID"

      - name: 검수용 내려받기 (inspect 브랜치)
        if: github.event.inputs.task == 'dump'
        working-directory: crawler
        env:
          Q: ${{ github.event.inputs.course_id }}
        run: |
          python dump.py "$Q"
          D=$(mktemp -d); cp -r inspect "$D/inspect"
          cd "$D" && git init -q && git checkout -q -b inspect
          git config user.name "crawl-bot"; git config user.email "crawl-bot@users.noreply.github.com"
          git add -A && git commit -qm "inspect ${{ github.run_id }} $Q"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" inspect
