# 구장추가 수집기 — 앱에서 요청하면 Cloudflare가 repository_dispatch(crawl)로 즉시 깨운다.
# 신호가 누락돼도 매시 정각에 한 번 대기열을 확인한다. 대기열이 비면 브라우저 설치 없이 몇 초 만에 끝난다.
# 필요한 저장소 Secrets: ANTHROPIC_API_KEY, WORKER_KEY, APP_URL
name: crawl

on:
  repository_dispatch:
    types: [crawl]
  workflow_dispatch:
    inputs:
      url:       { description: "바로 수집할 코스 페이지 주소 (비우면 대기열 처리)", required: false, default: "" }
      club_name: { description: "골프장명", required: false, default: "" }
      tees:      { description: "티 이름(긴 순서, 예: BLUE,WHITE,RED)", required: false, default: "" }
      course_names: { description: "코스 이름(순서대로, 예: 아리아,빌리,샬롯)", required: false, default: "" }
  schedule:
    - cron: "7 * * * *"

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_URL: ${{ secrets.APP_URL }}
      WORKER_KEY: ${{ secrets.WORKER_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: 대기열 확인
        id: q
        run: |
          set -e
          n=0
          for s in searching queued; do
            c=$(curl -fsS -H "X-Worker-Key: $WORKER_KEY" "$APP_URL/api/crawl-requests?status=$s" | python3 -c "import json,sys;print(len(json.load(sys.stdin)))")
            echo "$s: $c"; n=$((n + c))
          done
          [ -n "${{ github.event.inputs.url }}" ] && n=$((n + 1))     # 직접 수집 요청
          phase=idle; [ "$n" != "0" ] && phase=preparing
          curl -fsS -X POST -H "X-Worker-Key: $WORKER_KEY" "$APP_URL/api/worker/ping?phase=$phase" >/dev/null || true
          echo "pending=$n" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.q.outputs.pending != '0'

      - uses: actions/setup-python@v5
        if: steps.q.outputs.pending != '0'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - name: 브라우저 캐시
        if: steps.q.outputs.pending != '0'
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('crawler/requirements.txt') }}

      - name: 설치
        if: steps.q.outputs.pending != '0'
        run: |
          pip install -r crawler/requirements.txt
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium      # 브라우저는 캐시, 시스템 라이브러리만
          else
            python -m playwright install --with-deps chromium
          fi

      - name: 직접 수집 (workflow_dispatch url)
        if: github.event.inputs.url != ''
        working-directory: crawler
        env:
          IN_URL: ${{ github.event.inputs.url }}
          IN_NAME: ${{ github.event.inputs.club_name }}
          IN_TEES: ${{ github.event.inputs.tees }}
          IN_CN: ${{ github.event.inputs.course_names }}
        run: |
          ID=$(python -c "import crawl,os;print(crawl.course_id_for(os.environ['IN_URL']))")
          args=(--name "${IN_NAME:-$IN_URL}" --url "$IN_URL" --id "$ID")
          [ -n "$IN_TEES" ] && args+=(--tees "$IN_TEES")
          [ -n "$IN_CN" ] && args+=(--course-names "$IN_CN")
          python crawl.py "${args[@]}"
          python - <<PY
          import json,sys
          d=json.load(open("out/$ID/course.json",encoding="utf-8"))
          n=sum(len(c.get("holes") or []) for c in d["courses"])
          print("홀 수:", n); sys.exit(0 if n else 1)
          PY
          python worker.py --upload "$ID"

      - name: 결과 보관
        if: always() && steps.q.outputs.pending != '0'
        uses: actions/upload-artifact@v4
        with:
          name: crawl-out
          path: crawler/out/**/*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: 수집 실행
        if: steps.q.outputs.pending != '0'
        working-directory: crawler
        run: python worker.py --drain
