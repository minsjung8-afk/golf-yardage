# 구장추가 수집기 — 앱에서 요청하면 Cloudflare가 repository_dispatch(crawl)로 즉시 깨운다.
# 신호가 누락돼도 매시 정각에 한 번 대기열을 확인한다. 대기열이 비면 브라우저 설치 없이 몇 초 만에 끝난다.
# 필요한 저장소 Secrets: ANTHROPIC_API_KEY, WORKER_KEY, APP_URL
name: crawl

on:
  repository_dispatch:
    types: [crawl]
  workflow_dispatch: {}
  schedule:
    - cron: "7 * * * *"

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_URL: ${{ secrets.APP_URL }}
      WORKER_KEY: ${{ secrets.WORKER_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: 대기열 확인
        id: q
        run: |
          set -e
          n=0
          for s in searching queued; do
            c=$(curl -fsS -H "X-Worker-Key: $WORKER_KEY" "$APP_URL/api/crawl-requests?status=$s" | python3 -c "import json,sys;print(len(json.load(sys.stdin)))")
            echo "$s: $c"; n=$((n + c))
          done
          phase=idle; [ "$n" != "0" ] && phase=preparing
          curl -fsS -X POST -H "X-Worker-Key: $WORKER_KEY" "$APP_URL/api/worker/ping?phase=$phase" >/dev/null || true
          echo "pending=$n" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.q.outputs.pending != '0'

      - uses: actions/setup-python@v5
        if: steps.q.outputs.pending != '0'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - name: 브라우저 캐시
        if: steps.q.outputs.pending != '0'
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('crawler/requirements.txt') }}

      - name: 설치
        if: steps.q.outputs.pending != '0'
        run: |
          pip install -r crawler/requirements.txt
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium      # 브라우저는 캐시, 시스템 라이브러리만
          else
            python -m playwright install --with-deps chromium
          fi

      - name: 수집 실행
        if: steps.q.outputs.pending != '0'
        working-directory: crawler
        run: python worker.py --drain
